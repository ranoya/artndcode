    <script type="module">
      import orbitais from "../Pecas/pathcolor.js";

      let $_GET = [];
      (function () {
        let corte = window.location.href.toString().indexOf("?");
        if (corte > 0) {
          let argumento = window.location.href.toString().substring(corte + 1);
          let argumentos = argumento.split("&");
          for (let arg in argumentos) {
            let argCorte = argumentos[arg].indexOf("=");
            $_GET[argumentos[arg].substring(0, argCorte)] = argumentos[
              arg
            ].substring(argCorte + 1);
          }
        }
      })();

      let cor1 = "#000000";
      let cor2 = "#000000";
      let cor3 = "#000000";
      let cor4 = "#000000";
      let cor5 = "#000000";
      let cor6 = "#000000";
      let cor7 = "#000000";
      let corbg = "#FFFFFF";

      if ($_GET["cor1"]) {
        cor1 = "#" + $_GET["cor1"];
      }

      if ($_GET["cor2"]) {
        cor2 = "#" + $_GET["cor2"];
      }

      if ($_GET["cor3"]) {
        cor3 = "#" + $_GET["cor3"];
      }

      if ($_GET["cor4"]) {
        cor4 = "#" + $_GET["cor4"];

      if ($_GET["cor5"]) {
        cor5 = "#" + $_GET["cor5"];
      }

      if ($_GET["cor6"]) {
        cor6 = "#" + $_GET["cor6"];
      }

      if ($_GET["cor7"]) {
        cor7 = "#" + $_GET["cor7"];
      }

      if ($_GET["corbg"]) {
        corbg = "#" + $_GET["bgcolor"];
      }

      let orbis = orbitais({
        p5,
        bgcolor: corbg,
        fcolor1: cor1,
        fcolor2: cor2,
        fcolor3: cor3,
        fcolor4: cor4,
        fcolor5: cor5,
        fcolor6: cor6,
        fcolor7: cor7,
        el: "dorbitantis",
      });
